services:
  # MongoDB 数据库
  mongodb:
    image: mongo:7.0
    container_name: wxtools-mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      MONGO_INITDB_DATABASE: wxtools
    networks:
      - wxtools-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: wxtools-redis
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - wxtools-network

  # 后端服务
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wxtools-server
    restart: always
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/wxtools
      - REDIS_URL=redis://redis:6379
      - DOUYIN_RESOLVER_HOST=http://douyin-resolver:3008
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
      - redis
      - douyin-resolver
    networks:
      - wxtools-network

  # 抖音解析服务（获取无水印视频地址）
  # 依赖抖音登录 cookie，通过 DOUYIN_COOKIE 环境变量注入（可选，未配置则抖音解析不可用）
  douyin-resolver:
    build:
      context: ./server/douyin-resolver
      dockerfile: Dockerfile
    container_name: wxtools-douyin-resolver
    restart: always
    ports:
      - "3008:3008"
    environment:
      - DOUYIN_COOKIE=${DOUYIN_COOKIE:-}
    networks:
      - wxtools-network

volumes:
  mongodb_data:
  mongodb_config:
  uploads_data:
  redis_data:

networks:
  wxtools-network:
    driver: bridge
