services:
  # MongoDB 数据库
  mongodb:
    image: mongo:7.0
    restart: always
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      MONGO_INITDB_DATABASE: wxtools
    networks:
      - wxtools-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - wxtools-network

  # 后端服务
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${SERVER_PORT:-3005}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/wxtools
      - REDIS_URL=redis://redis:6379
      - DOUYIN_RESOLVER_HOST=http://douyin-resolver:3008
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
      - redis
      - douyin-resolver
    networks:
      - wxtools-network

  # 抖音解析服务（获取无水印视频地址）
  # 双通道：
  #   主通道 —— 直连抖音 web 详情接口（快速，元数据全）
  #   兜底   —— 接口被风控挡住时，转发到宿主机的浏览器兜底服务
  #             （opencli 驱动本地 Chrome 读播放地址，见 docs/DOUYIN_BROWSER_FALLBACK.md）
  douyin-resolver:
    build:
      context: ./server/douyin-resolver
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${RESOLVER_PORT:-3008}:3008"
    environment:
      - DOUYIN_COOKIE=${DOUYIN_COOKIE:-}
      # 宿主机上的浏览器兜底服务（opencli + 本地 Chrome）
      # ⚠️ 用 wxtools-network 的网关地址，不要用 host.docker.internal ——
      #    后者在自定义 bridge 网络里会被解析成 docker0 的 172.17.0.1，
      #    跨网段路由不通（实测 timeout）。网关 172.18.0.1 才是宿主机。
      - DY_BROWSER_HOST=${DY_BROWSER_HOST:-http://172.18.0.1:3009}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - wxtools-network

volumes:
  mongodb_data:
  mongodb_config:
  uploads_data:
  redis_data:

networks:
  wxtools-network:
    driver: bridge
